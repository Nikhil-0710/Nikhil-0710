<svg width="1180" height="610" viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow1Light" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bgGlow2Light" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    
    <linearGradient id="accentGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <filter id="glassLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.05" />
    </filter>

    <clipPath id="typewriterLight">
      <rect x="0" y="0" width="0" height="40">
        <animate attributeName="width" from="0" to="500" dur="3.5s" fill="freeze" />
      </rect>
    </clipPath>
    <clipPath id="asciiRevealLight">
      <rect x="0" y="0" width="450" height="0">
        <animate attributeName="height" from="0" to="500" dur="4s" fill="freeze" />
      </rect>
    </clipPath>
  </defs>

  <rect width="1180" height="610" fill="#FFFFFF" rx="16" />
  <rect width="1180" height="610" fill="url(#bgGlow1Light)" rx="16" />
  <rect width="1180" height="610" fill="url(#bgGlow2Light)" rx="16" />

  <!-- LEFT SIDE -->
  <g transform="translate(40, 40)">
    <animateTransform attributeName="transform" type="translate" values="40,40; 40,30; 40,40" dur="6s" repeatCount="indefinite" />
    <rect width="400" height="530" fill="#F8FAFC" stroke="rgba(15,23,42,0.08)" rx="12" filter="url(#glassLight)" />
    
    <g clip-path="url(#asciiRevealLight)" fill="url(#accentGradientLight)" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="1">
      <text x="40" y="80">      .-----------------.      </text>
      <text x="40" y="98">     /                 /|      </text>
      <text x="40" y="116">    /                 / |      </text>
      <text x="40" y="134">   /_________________/  |      </text>
      <text x="40" y="152">   |  .............  |  |      </text>
      <text x="40" y="170">   |  |           |  |  |      </text>
      <text x="40" y="188">   |  | >_        |  |  |      </text>
      <text x="40" y="206">   |  |           |  |  |      </text>
      <text x="40" y="224">   |  |___________|  |  |      </text>
      <text x="40" y="242">   |  .---------.    | /       </text>
      <text x="40" y="260">   | (           )   |/        </text>
      <text x="40" y="278">   |  `---------'    |         </text>
      <text x="40" y="296">   `-----------------'         </text>
      <text x="40" y="314">           | |                 </text>
      <text x="40" y="332">  .-------------------.        </text>
      <text x="40" y="350">  | ::::::::::::::::: |        </text>
      <text x="40" y="368">  `-------------------'        </text>
      
      <text x="40" y="440">> BOOT SEQUENCE INITIATED...</text>
      <text x="40" y="470">> RENDER COMPLETE_</text>
    </g>
  </g>

  <!-- RIGHT SIDE -->
  <g transform="translate(480, 40)">
    <rect width="660" height="530" fill="#F8FAFC" fill-opacity="0.8" stroke="rgba(15,23,42,0.08)" stroke-width="1" rx="12" filter="url(#glassLight)" />
    
    <circle cx="30" cy="30" r="6" fill="#EF4444" />
    <circle cx="50" cy="30" r="6" fill="#F59E0B" />
    <circle cx="70" cy="30" r="6" fill="#10B981" />
    <text x="330" y="34" fill="#475569" font-family="monospace" font-size="12" text-anchor="middle">guest@nishchay: ~</text>
    <line x1="0" y1="50" x2="660" y2="50" stroke="rgba(15,23,42,0.05)" stroke-width="1" />

    <g transform="translate(40, 100)" font-family="sans-serif">
      <text x="0" y="0" fill="#475569" font-size="20" font-weight="500">Hi,</text>
      <text x="0" y="45" fill="#0F172A" font-size="44" font-weight="800" letter-spacing="-1">I'm Nishchay Agrawal</text>
      
      <g clip-path="url(#typewriterLight)" transform="translate(0, 75)">
        <text x="0" y="20" fill="url(#accentGradientLight)" font-size="22" font-weight="600" font-family="monospace">
          > Computer Science Student
        </text>
      </g>
      <rect x="335" y="77" width="12" height="24" fill="#2563EB">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>

    <g transform="translate(40, 240)" font-family="sans-serif" font-size="15" fill="#475569">
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="2s" fill="freeze" />
      <text x="0" y="0"><tspan fill="#0F172A" font-weight="600">Location:</tspan> Uttar Pradesh, India</text>
      <text x="0" y="35"><tspan fill="#0F172A" font-weight="600">Education:</tspan> Ajay Kumar Garg Engineering College</text>
      <text x="0" y="70"><tspan fill="#0F172A" font-weight="600">Focus:</tspan> AI/ML Solutions, Scalable Backend &amp; Web Architecture</text>
    </g>

    <g transform="translate(40, 360)">
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="3s" fill="freeze" />
      <text x="0" y="0" fill="#0F172A" font-family="sans-serif" font-size="16" font-weight="700">Tech Stack</text>
      
      <g transform="translate(0, 20)">
        <rect x="0" y="0" width="80" height="32" rx="16" fill="rgba(37, 99, 235, 0.1)" stroke="rgba(37, 99, 235, 0.2)" />
        <text x="40" y="21" fill="#2563EB" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="600">Python</text>
        
        <rect x="90" y="0" width="75" height="32" rx="16" fill="rgba(6, 182, 212, 0.1)" stroke="rgba(6, 182, 212, 0.2)" />
        <text x="127.5" y="21" fill="#06B6D4" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="600">C/C++</text>

        <rect x="175" y="0" width="75" height="32" rx="16" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.2)" />
        <text x="212.5" y="21" fill="#10B981" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="600">Flask</text>

        <rect x="260" y="0" width="135" height="32" rx="16" fill="rgba(6, 182, 212, 0.1)" stroke="rgba(6, 182, 212, 0.2)" />
        <text x="327.5" y="21" fill="#06B6D4" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="600">Machine Learning</text>

        <rect x="0" y="45" width="85" height="32" rx="16" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.2)" />
        <text x="42.5" y="66" fill="#10B981" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="600">MySQL</text>

        <rect x="95" y="45" width="60" height="32" rx="16" fill="rgba(37, 99, 235, 0.1)" stroke="rgba(37, 99, 235, 0.2)" />
        <text x="125" y="66" fill="#2563EB" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="600">Git</text>
      </g>
    </g>
  </g>
</svg>
