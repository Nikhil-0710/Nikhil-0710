<svg width="1180" height="610" viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bgGlow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <filter id="glass" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <clipPath id="typewriter">
      <rect x="0" y="0" width="0" height="40">
        <animate attributeName="width" from="0" to="500" dur="3.5s" fill="freeze" />
      </rect>
    </clipPath>
    <clipPath id="asciiReveal">
      <rect x="0" y="0" width="450" height="0">
        <animate attributeName="height" from="0" to="500" dur="4s" fill="freeze" />
      </rect>
    </clipPath>
  </defs>

  <rect width="1180" height="610" fill="#030712" rx="16" />
  <rect width="1180" height="610" fill="url(#bgGlow1)" rx="16" />
  <rect width="1180" height="610" fill="url(#bgGlow2)" rx="16" />

  <!-- LEFT SIDE: ASCII Terminal (38%) -->
  <g transform="translate(40, 40)">
    <animateTransform attributeName="transform" type="translate" values="40,40; 40,30; 40,40" dur="6s" repeatCount="indefinite" />
    <rect width="400" height="530" fill="none" stroke="rgba(255,255,255,0.08)" rx="12" />
    
    <g clip-path="url(#asciiReveal)" fill="url(#accentGradient)" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="1">
      <text x="40" y="80">      .-----------------.      </text>
      <text x="40" y="98">     /                 /|      </text>
      <text x="40" y="116">    /                 / |      </text>
      <text x="40" y="134">   /_________________/  |      </text>
      <text x="40" y="152">   |  .............  |  |      </text>
      <text x="40" y="170">   |  |           |  |  |      </text>
      <text x="40" y="188">   |  | >_        |  |  |      </text>
      <text x="40" y="206">   |  |           |  |  |      </text>
      <text x="40" y="224">   |  |___________|  |  |      </text>
      <text x="40" y="242">   |  .---------.    | /       </text>
      <text x="40" y="260">   | (           )   |/        </text>
      <text x="40" y="278">   |  `---------'    |         </text>
      <text x="40" y="296">   `-----------------'         </text>
      <text x="40" y="314">           | |                 </text>
      <text x="40" y="332">  .-------------------.        </text>
      <text x="40" y="350">  | ::::::::::::::::: |        </text>
      <text x="40" y="368">  `-------------------'        </text>
      
      <text x="40" y="440">> BOOT SEQUENCE INITIATED...</text>
      <text x="40" y="470">> RENDER COMPLETE_</text>
    </g>
  </g>

  <!-- RIGHT SIDE: Terminal Window -->
  <g transform="translate(480, 40)">
    <rect width="660" height="530" fill="#0F172A" fill-opacity="0.7" stroke="rgba(255,255,255,0.08)" stroke-width="1" rx="12" filter="url(#glass)" />
    
    <circle cx="30" cy="30" r="6" fill="#EF4444" />
    <circle cx="50" cy="30" r="6" fill="#F59E0B" />
    <circle cx="70" cy="30" r="6" fill="#10B981" />
    <text x="330" y="34" fill="#94A3B8" font-family="monospace" font-size="12" text-anchor="middle">guest@nishchay: ~</text>
    <line x1="0" y1="50" x2="660" y2="50" stroke="rgba(255,255,255,0.05)" stroke-width="1" />

    <!-- Greeting & Typing Text -->
    <g transform="translate(40, 100)" font-family="sans-serif">
      <text x="0" y="0" fill="#94A3B8" font-size="20" font-weight="500">Hi,</text>
      <text x="0" y="45" fill="#F8FAFC" font-size="44" font-weight="800" letter-spacing="-1">I'm Nishchay Agrawal</text>
      
      <!-- Animated Role -->
      <g clip-path="url(#typewriter)" transform="translate(0, 75)">
        <text x="0" y="20" fill="url(#accentGradient)" font-size="22" font-weight="600" font-family="monospace">
          > Computer Science Student
        </text>
      </g>
      <!-- Blinking Cursor -->
      <rect x="335" y="77" width="12" height="24" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Bio / Details (Sequential Reveal) -->
    <g transform="translate(40, 240)" font-family="sans-serif" font-size="15" fill="#94A3B8">
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="2s" fill="freeze" />
      
      <text x="0" y="0"><tspan fill="#F8FAFC" font-weight="600">Location:</tspan> Uttar Pradesh, India</text>
      <text x="0" y="35"><tspan fill="#F8FAFC" font-weight="600">Education:</tspan> Ajay Kumar Garg Engineering College</text>
      <text x="0" y="70"><tspan fill="#F8FAFC" font-weight="600">Focus:</tspan> AI/ML Solutions, Scalable Backend &amp; Web Architecture</text>
    </g>

    <!-- Skills Section (Glowing Pills) -->
    <g transform="translate(40, 360)">
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="3s" fill="freeze" />
      <text x="0" y="0" fill="#F8FAFC" font-family="sans-serif" font-size="16" font-weight="700">Tech Stack</text>
      
      <!-- Pills -->
      <g transform="translate(0, 20)">
        <!-- Row 1 -->
        <rect x="0" y="0" width="80" height="32" rx="16" fill="rgba(124, 58, 237, 0.1)" stroke="rgba(124, 58, 237, 0.3)" />
        <text x="40" y="21" fill="#7C3AED" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="600">Python</text>
        
        <rect x="90" y="0" width="75" height="32" rx="16" fill="rgba(34, 211, 238, 0.1)" stroke="rgba(34, 211, 238, 0.3)" />
        <text x="127.5" y="21" fill="#22D3EE" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="600">C/C++</text>

        <rect x="175" y="0" width="75" height="32" rx="16" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" />
        <text x="212.5" y="21" fill="#10B981" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="600">Flask</text>

        <rect x="260" y="0" width="135" height="32" rx="16" fill="rgba(34, 211, 238, 0.1)" stroke="rgba(34, 211, 238, 0.3)" />
        <text x="327.5" y="21" fill="#22D3EE" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="600">Machine Learning</text>

        <!-- Row 2 -->
        <rect x="0" y="45" width="85" height="32" rx="16" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" />
        <text x="42.5" y="66" fill="#10B981" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="600">MySQL</text>

        <rect x="95" y="45" width="60" height="32" rx="16" fill="rgba(124, 58, 237, 0.1)" stroke="rgba(124, 58, 237, 0.3)" />
        <text x="125" y="66" fill="#7C3AED" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="600">Git</text>
      </g>
    </g>
  </g>
</svg>
